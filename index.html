
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">

        <span class="badge">Student</span>

        <img src="/image/passport_photo_corrected.jpg"
             alt="Profile Image"
             class="profile-image">

        <h1>Vivek</h1>
        <h3>Web Development Student</h3>

        <p class="description">
            I am a beginner web developer learning HTML,
            CSS and JavaScript. I love creating websites
            and learning new technologies.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
        </div>

        <button class="contact-btn">Contact Me</button>

    </div>

</body>
</html>
